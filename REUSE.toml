# SPDX-License-Identifier: AGPL-3.0-only
#
# The licence of every tracked file that does not carry its own SPDX header —
# a file with no comment syntax, a file whose bytes a test asserts, or
# third-party material kept exactly as its authors published it — in the
# format of the REUSE specification 3.2 (https://reuse.software/spec-3.2/).
# hack/spdx_check.py reads this file in CI: every tracked file is covered
# by its own header or by exactly one annotation here.
#
# First-party annotations carry the licence identifier alone and no
# copyright line: an identifier declares terms and claims no ownership.
# The repository's copyright and licensing statement is NOTICE's.
# Third-party annotations name the real holders and licences, as NOTICE and
# console/VENDOR.md record them, and a third-party file is never
# relabelled. The `reuse` tool is
# not adopted: REUSE compliance asks for a copyright notice on every file,
# which the owner's decision declines for first-party material.
version = 1

# --- first-party, no comment syntax (SOURCE, the one-line source location;
# the dependency allowlist, which also carries its own header) ---------------
[[annotations]]
path = ["VERSION", "SOURCE", "go.mod", "go.sum", ".gitignore", "NOTICE", "hack/allowed-licenses.txt"]
SPDX-License-Identifier = "AGPL-3.0-only"

# --- first-party, bytes a test asserts: the console's fragment goldens, the
# plan goldens, and a fixture file whose path is a directory on purpose ------
[[annotations]]
path = ["internal/console/testdata/*.html", "internal/lab/testdata/golden/*", "internal/lab/testdata/modules/dirfile/module.yaml/README"]
SPDX-License-Identifier = "AGPL-3.0-only"

# --- third-party: the console's vendored scripts, copied unmodified from the
# npm tarballs console/VENDOR.md pins ----------------------------------------
[[annotations]]
path = "console/assets/htmx.min.js"
SPDX-FileCopyrightText = "2020 Big Sky Software"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = "console/assets/sse.min.js"
SPDX-FileCopyrightText = "2023 Alexander Petros"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = "console/assets/alpine-csp.min.js"
SPDX-FileCopyrightText = ["2019-2021 Caleb Porzio and contributors", "2018-present Yuxi (Evan) You (@vue/reactivity and @vue/shared 3.5.41, which the build bundles)"]
SPDX-License-Identifier = "MIT"

# --- third-party: the console's fonts ----------------------------------------
[[annotations]]
path = "console/assets/fonts/IBMPlexMono-*.woff2"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "console/assets/fonts/poppins-*.woff2"
SPDX-FileCopyrightText = "2020 The Poppins Project Authors (https://github.com/itfoundry/Poppins)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "console/assets/fonts/inter-*.woff2"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# --- third-party: the vendored assets' licence texts, verbatim --------------
[[annotations]]
path = "console/assets/LICENSES/htmx.txt"
SPDX-FileCopyrightText = "2020 Big Sky Software"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = "console/assets/LICENSES/htmx-ext-sse.txt"
SPDX-FileCopyrightText = "2023 Alexander Petros"
SPDX-License-Identifier = "0BSD"

[[annotations]]
path = "console/assets/LICENSES/ibm-plex-mono.txt"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\""
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "console/assets/LICENSES/poppins.txt"
SPDX-FileCopyrightText = "2020 The Poppins Project Authors (https://github.com/itfoundry/Poppins)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "console/assets/LICENSES/inter.txt"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "console/assets/LICENSES/vue.txt"
SPDX-FileCopyrightText = "2018-present Yuxi (Evan) You"
SPDX-License-Identifier = "MIT"

# --- third-party: derived data — the NCSC "100k most used
# passwords" list as redistributed in SecLists, filtered to entries of 12 or
# more characters; the file also carries its own MIT header ---------------
[[annotations]]
path = "internal/auth/common-passwords.txt"
SPDX-FileCopyrightText = "Daniel Miessler (SecLists)"
SPDX-License-Identifier = "MIT"

# --- the licence texts themselves, kept verbatim: the identifier names the
# licence each text is, and the copyright line the text's own author as the
# text states it — the Apache-2.0 text states none. The REUSE specification
# exempts files named LICENSE and the texts under LICENSES/; they are listed
# so that every tracked file is named ----------------------------------------
[[annotations]]
path = "LICENSE"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "LICENSES/Apache-2.0.txt"
SPDX-License-Identifier = "Apache-2.0"

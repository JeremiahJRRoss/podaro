<section class="secrets" aria-label="credentials">
  <table class="mono">
    <thead><tr><th scope="col">secret</th><th scope="col">kind</th><th scope="col">declared by</th><th scope="col">value</th></tr></thead>
    <tbody>
      <tr>
        <th scope="row">beta-admin</th>
        <td class="muted">password</td>
        <td class="muted">beta</td>
        <td class="reveal-cell">
          <span class="masked" aria-hidden="true">●●●●●●</span>
          <button class="button reveal" type="button"
            hx-post="/api/v1alpha1/instances/pii-lab/secrets/beta-admin/reveal"
            hx-headers='{"X-Podaro-CSRF":"csrf-token"}'
            hx-target="this" hx-swap="outerHTML"
            aria-label="reveal beta-admin">Reveal</button>
        </td>
      </tr>
      <tr>
        <th scope="row">gamma-token</th>
        <td class="muted">token</td>
        <td class="muted">gamma, beta</td>
        <td class="reveal-cell">
          <span class="masked" aria-hidden="true">●●●●●●</span>
          <button class="button reveal" type="button"
            hx-post="/api/v1alpha1/instances/pii-lab/secrets/gamma-token/reveal"
            hx-headers='{"X-Podaro-CSRF":"csrf-token"}'
            hx-target="this" hx-swap="outerHTML"
            aria-label="reveal gamma-token">Reveal</button>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="muted note">A revealed value re-masks after 30 seconds and is written to evidence. There is no reveal-all.</p>
</section>

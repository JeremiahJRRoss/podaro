<section class="keymap" aria-label="keyboard map">
  <h2 class="section">Keyboard</h2>
  <dl class="keys mono">
    <dt>[</dt><dd>previous step</dd>
    <dt>]</dt><dd>next step</dd>
    <dt>v</dt><dd>verify the current step</dd>
    <dt>r</dt><dd>toggle the rail</dd>
    <dt>1–9</dt><dd>switch tab</dd>
    <dt>← →</dt><dd>move across the tabs (Enter opens)</dd>
    <dt>?</dt><dd>show this map</dd>
  </dl>
</section>

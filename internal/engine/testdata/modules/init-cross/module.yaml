# Engine test fixture: a module whose init targets another service of the
# template (zeta) before its own — the bring-up must start zeta first.
apiVersion: lab.podaro.dev/v1alpha1
kind: Module
metadata: { name: init-cross, version: "1.0", title: Fixture module init-cross }
image: { repository: docker.io/library/nginx, tag: "1.28.0", digest: sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609 }
readiness: { probe: { port: 80 }, typical: 100ms, budget: 10s }
endpoints: [ { purpose: ui, port: 80 } ]
embed: iframe
resources: { cpu: 500m, memory: 128MiB }
init:
  image: { repository: docker.io/curlimages/curl, tag: 8.21.0, digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc }
  requests:
    - { method: GET, service: zeta, path: /, until: { status: 200 }, retries: { attempts: 2, backoff: 50ms } }
    - { method: POST, path: /api/register, body: { with: zeta } }

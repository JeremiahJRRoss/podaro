apiVersion: lab.podaro.dev/v1alpha1
kind: Playbook
metadata: { name: p, title: "P ${secret:token}" }
steps:
  - id: one
    title: One
    body: text
    checkpoint: { id: c1, adapter: http, params: { url: "http://prometheus:9090/${secret:token}" },
